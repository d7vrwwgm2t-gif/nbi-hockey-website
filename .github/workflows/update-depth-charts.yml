name: Update Depth Charts

on:
  schedule:
    # Runs every day at 12:00 PM Eastern during standard time.
    # In daylight time this runs at 1:00 PM Eastern because GitHub Actions uses UTC.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-depth-charts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch depth charts
        run: python scripts/update_depth_charts.py

      - name: Commit updated depth chart data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update depth chart data"
          file_pattern: public/data/depth-charts.json